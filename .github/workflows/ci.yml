name: Serenity con VPN (OpenVPN)

on:
  workflow_dispatch:
    inputs:
      feature_folder:
        description: "Carpeta del feature (ej: registros_publicos)"
        required: true
      feature_file:
        description: "Archivo feature (ej: simulacion_pagos_electronicos.feature)"
        required: true

jobs:
  serenity-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projectconfecamaras-master

    steps:
      # 1️⃣ Checkout
      - name: Checkout código
        uses: actions/checkout@v4

      # 2️⃣ Instalar OpenVPN
      - name: Instalar OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn

      # 3️⃣ Crear archivos VPN
      - name: Configurar VPN
        run: |
          echo "${{ secrets.OPENVPN_CONFIG }}" > vpn.ovpn
          echo "${{ secrets.OPENVPN_USER }}" > vpn-auth.txt
          echo "${{ secrets.OPENVPN_PASS }}" >> vpn-auth.txt
          chmod 600 vpn.ovpn vpn-auth.txt

      # 4️⃣ Conectar a la VPN
      - name: Conectar VPN
        run: |
          sudo openvpn --config vpn.ovpn --auth-user-pass vpn-auth.txt --daemon
          sleep 20
          ip a
          ip route

      # 5️⃣ Java
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 6️⃣ Gradle
      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      # 7️⃣ Validar feature
      - name: Validar feature seleccionado
        run: |
          FEATURE_PATH="src/test/resources/features/${{ github.event.inputs.feature_folder }}/${{ github.event.inputs.feature_file }}"
          echo "Feature seleccionado: $FEATURE_PATH"

          if [ ! -f "$FEATURE_PATH" ]; then
            echo "❌ Feature no encontrado"
            exit 1
          fi

          echo "FEATURE_PATH=$FEATURE_PATH" >> $GITHUB_ENV

      # 8️⃣ Ejecutar Serenity
      - name: Ejecutar Serenity
        run: |
          ./gradlew clean test aggregate \
            -Dcucumber.features=$FEATURE_PATH

      # 9️⃣ Subir reporte
      - name: Subir reporte Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: projectconfecamaras-master/target/site/serenity

      # 🔟 Mostrar instrucciones QA
      - name: Mostrar link del reporte
        if: always()
        run: |
          echo "## 📊 Reporte Serenity" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Pasos para el QA:" >> $GITHUB_STEP_SUMMARY
          echo "1. Ir a la ejecución del pipeline" >> $GITHUB_STEP_SUMMARY
          echo "2. Bajar hasta **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "3. Descargar **serenity-report**" >> $GITHUB_STEP_SUMMARY
          echo "4. Abrir **index.html**" >> $GITHUB_STEP_SUMMARY
