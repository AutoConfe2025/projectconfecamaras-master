name: Proyecto Confecamaras - Serenity CI

on:
  workflow_dispatch:
    inputs:
      feature_folder:
        description: "Carpeta del feature (ej: registros_publicos)"
        required: true
      feature_file:
        description: "Archivo feature (ej: boletin_noticia_mercantil.feature)"
        required: true

jobs:
  serenity-tests:
    runs-on: ubuntu-latest

    env:
      CI: true
      HEALENIUM_ENABLED: false

    defaults:
      run:
        working-directory: projectconfecamaras-master

    steps:
      # =========================
      # 1️⃣ CHECKOUT
      # =========================
      - name: Checkout código
        uses: actions/checkout@v4

      # =========================
      # 2️⃣ JAVA 21
      # =========================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # =========================
      # 3️⃣ INSTALAR GOOGLE CHROME (CRÍTICO)
      # =========================
      - name: Instalar Google Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable
          google-chrome --version

      # =========================
      # 4️⃣ PERMISOS GRADLE
      # =========================
      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      # =========================
      # 5️⃣ VALIDAR FEATURE SELECCIONADO
      # =========================
      - name: Validar feature seleccionado
        run: |
          FEATURE_PATH="src/test/resources/features/${{ github.event.inputs.feature_folder }}/${{ github.event.inputs.feature_file }}"
          echo "📌 Feature seleccionado: $FEATURE_PATH"

          if [ ! -f "$FEATURE_PATH" ]; then
            echo "❌ Feature no encontrado"
            exit 1
          fi

          echo "FEATURE_PATH=$FEATURE_PATH" >> $GITHUB_ENV

      # =========================
      # 6️⃣ EJECUTAR SERENITY
      # =========================
      - name: Ejecutar Serenity (1 feature)
        run: |
          ./gradlew clean test aggregate --continue \
            -Dcucumber.features=$FEATURE_PATH \
            -Denvironment=ci \
            -Dci=true

      # =========================
      # 7️⃣ SUBIR REPORTE SERENITY
      # =========================
      - name: Subir reporte Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: projectconfecamaras-master/target/site/serenity

      # =========================
      # 8️⃣ INSTRUCCIONES QA
      # =========================
      - name: Mostrar instrucciones QA
        if: always()
        run: |
          echo "## 📊 Reporte Serenity" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Pasos para el QA:" >> $GITHUB_STEP_SUMMARY
          echo "1. Abrir la ejecución del pipeline" >> $GITHUB_STEP_SUMMARY
          echo "2. Bajar hasta **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "3. Descargar **serenity-report**" >> $GITHUB_STEP_SUMMARY
          echo "4. Abrir **index.html**" >> $GITHUB_STEP_SUMMARY
