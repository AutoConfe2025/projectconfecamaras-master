name: Proyecto confecamaras

on:
  workflow_dispatch:
    inputs:
      feature_folder:
        description: "Carpeta del feature (ej: registros_publicos)"
        required: true
      feature_file:
        description: "Archivo feature (ej: simulacion_pagos_electronicos.feature)"
        required: true

jobs:
  serenity-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projectconfecamaras-master

    services:
      hlm-postgres:
        image: postgres:13
        env:
          POSTGRES_DB: healenium
          POSTGRES_USER: healenium
          POSTGRES_PASSWORD: healenium
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U healenium"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      hlm-backend:
        image: healenium/hlm-backend:latest
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://hlm-postgres:5432/healenium
          SPRING_DATASOURCE_USERNAME: healenium
          SPRING_DATASOURCE_PASSWORD: healenium
        ports:
          - 7878:7878
        options: >-
          --health-cmd="curl -f http://localhost:7878/actuator/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn

      - name: Configurar VPN
        run: |
          echo "${{ secrets.OPENVPN_CONFIG }}" > vpn.ovpn
          echo "${{ secrets.OPENVPN_USER }}" > vpn-auth.txt
          echo "${{ secrets.OPENVPN_PASS }}" >> vpn-auth.txt
          chmod 600 vpn.ovpn vpn-auth.txt

      - name: Conectar VPN
        run: |
          sudo openvpn --config vpn.ovpn --auth-user-pass vpn-auth.txt --daemon
          sleep 20
          ip route

      - name: Esperar Healenium Backend
        run: |
          echo "⏳ Esperando Healenium backend..."
          for i in {1..20}; do
            if curl -s http://localhost:7878/actuator/health | grep -q UP; then
              echo "✅ Healenium backend listo"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Healenium backend no respondió"
          exit 1

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Validar feature seleccionado
        run: |
          FEATURE_PATH="src/test/resources/features/${{ github.event.inputs.feature_folder }}/${{ github.event.inputs.feature_file }}"
          echo "Feature seleccionado: $FEATURE_PATH"

          if [ ! -f "$FEATURE_PATH" ]; then
            echo "❌ Feature no encontrado"
            exit 1
          fi

          echo "FEATURE_PATH=$FEATURE_PATH" >> $GITHUB_ENV

      - name: Ejecutar Serenity
        run: |
          ./gradlew clean test aggregate --continue \
            -Dserenity.features=$FEATURE_PATH

      - name: Subir reporte Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: projectconfecamaras-master/target/site/serenity

      - name: Mostrar instrucciones QA
        if: always()
        run: |
          echo "## 📊 Reporte Serenity" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Pasos para el QA:" >> $GITHUB_STEP_SUMMARY
          echo "1. Abrir la ejecución del pipeline" >> $GITHUB_STEP_SUMMARY
          echo "2. Bajar hasta **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "3. Descargar **serenity-report**" >> $GITHUB_STEP_SUMMARY
          echo "4. Abrir **index.html**" >> $GITHUB_STEP_SUMMARY
