name: CI - Confecamaras Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projectconfecamaras-master

    steps:
    - name: Paso 1 - Descargar el código
      uses: actions/checkout@v4

    - name: Paso 2 - Instalar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Paso 3 - Permisos Gradle
      run: chmod +x gradlew

    - name: Paso 4 - Ejecutar pruebas
      run: ./gradlew clean test
