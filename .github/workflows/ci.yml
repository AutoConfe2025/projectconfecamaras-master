name: CI - Ejecutar Feature Específico

on:
  workflow_dispatch:
    inputs:
      feature_path:
        description: 'Ruta del feature (ej: src/test/resources/features/login.feature)'
        required: true
        default: 'src/test/resources/features/login.feature'

jobs:
  ejecutar-feature:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projectconfecamaras-master

    steps:
    - name: Paso 1 - Descargar el código
      uses: actions/checkout@v4

    - name: Paso 2 - Instalar Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Paso 3 - Dar permisos a Gradle
      run: chmod +x gradlew

    - name: Paso 4 - Ejecutar feature seleccionado
      run: |
        echo "Ejecutando feature: ${{ github.event.inputs.feature_path }}"
        ./gradlew clean test -Dcucumber.features="${{ github.event.inputs.feature_path }}"
