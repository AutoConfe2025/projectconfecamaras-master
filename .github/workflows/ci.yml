name: Serenity - Ejecutar Feature y Publicar Reporte

on:
  workflow_dispatch:
    inputs:
      feature_folder:
        description: "Carpeta del feature (ej: registros_publicos)"
        required: true
      feature_file:
        description: "Archivo feature (ej: simulacion_pagos_electronicos.feature)"
        required: true

jobs:
  serenity-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projectconfecamaras-master

    steps:
      # 1️⃣ Checkout
      - name: Checkout código
        uses: actions/checkout@v4

      # 2️⃣ Java
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3️⃣ Gradle
      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      # 4️⃣ Validar feature
      - name: Validar feature seleccionado
        run: |
          FEATURE_PATH="src/test/resources/features/${{ github.event.inputs.feature_folder }}/${{ github.event.inputs.feature_file }}"
          echo "Feature seleccionado: $FEATURE_PATH"

          if [ ! -f "$FEATURE_PATH" ]; then
            echo "❌ Feature no encontrado"
            exit 1
          fi

          echo "FEATURE_PATH=$FEATURE_PATH" >> $GITHUB_ENV

      # 5️⃣ Ejecutar Serenity (TEST + AGGREGATE)
      - name: Ejecutar Serenity
        run: |
          ./gradlew clean test aggregate \
            -Dserenity.features=$FEATURE_PATH

      # 6️⃣ Copiar reporte a carpeta pública
      - name: Preparar reporte para GitHub Pages
        if: always()
        run: |
          rm -rf docs
          mkdir -p docs/serenity
          cp -R target/site/serenity/* docs/serenity

      # 7️⃣ Publicar en GitHub Pages
      - name: Publicar reporte Serenity
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: projectconfecamaras-master/docs
