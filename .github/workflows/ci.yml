name: Serenity - Ejecutar Feature Específico

on:
  workflow_dispatch:
    inputs:
      feature_folder:
        description: "Carpeta del feature (ej: registros_publicos)"
        required: true
      feature_file:
        description: "Archivo feature (ej: simulacion_pagos_electronicos.feature)"
        required: true

jobs:
  serenity-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projectconfecamaras-master

    steps:
      # 1️⃣ Checkout
      - name: Checkout código
        uses: actions/checkout@v4

      # 2️⃣ Java
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3️⃣ Gradle
      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      # 4️⃣ Validar feature
      - name: Validar feature seleccionado
        run: |
          FEATURE_PATH="src/test/resources/features/${{ github.event.inputs.feature_folder }}/${{ github.event.inputs.feature_file }}"
          echo "Feature seleccionado: $FEATURE_PATH"

          if [ ! -f "$FEATURE_PATH" ]; then
            echo "❌ Feature no encontrado"
            exit 1
          fi

          echo "FEATURE_PATH=$FEATURE_PATH" >> $GITHUB_ENV

      # 5️⃣ Ejecutar Serenity (OBLIGATORIO aggregate)
      - name: Ejecutar Serenity
        run: |
          ./gradlew clean test aggregate \
            -Dserenity.features=$FEATURE_PATH

      # 6️⃣ Subir reporte Serenity como artifact
      - name: Subir reporte Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: projectconfecamaras-master/target/site/serenity

      # 7️⃣ Mostrar link claro para el QA
      - name: Mostrar link del reporte
        if: always()
        run: |
          echo "## 📊 Reporte Serenity" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Para ver el reporte:" >> $GITHUB_STEP_SUMMARY
          echo "1. Baja hasta **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "2. Descarga **serenity-report**" >> $GITHUB_STEP_SUMMARY
          echo "3. Abre **index.html**" >> $GITHUB_STEP_SUMMARY
