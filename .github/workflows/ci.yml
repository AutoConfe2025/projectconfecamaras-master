name: CI - Confecamaras Automation

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      cucumber_tags:
        description: 'Tags de Cucumber a ejecutar (ej: @login, @facturacion, @login and not @wip)'
        required: true
        default: '@login'

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projectconfecamaras-master

    steps:
    - name: Paso 1 - Descargar el código
      uses: actions/checkout@v4

    - name: Paso 2 - Instalar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Paso 3 - Dar permisos a Gradle
      run: chmod +x gradlew

    - name: Paso 4 - Ejecutar pruebas por tags
      run: |
        echo "Ejecutando pruebas con tags: ${{ github.event.inputs.cucumber_tags }}"
        ./gradlew clean test -Dcucumber.filter.tags="${{ github.event.inputs.cucumber_tags }}"
