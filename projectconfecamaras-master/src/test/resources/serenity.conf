serenity.project.name = Confecamaras

webdriver {
  driver = chrome
  #driver = firefox
}
//headless.mode = true

webdriver.wait.for.timeout = 20000
driver_capabilities.common.unexpectedAlertBehaviour=ignore
webdriver.wait.for.timeout = 20000
driver.page_load_strategy = 'normal'
#--disable-popup-blocking;
# Chrome options can be defined using the chrome.switches property
#
chrome.switches="""--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars,--disable-gpu"""

#
# Define drivers for different platforms. Serenity will automatically pick the correct driver for the current platform
#
drivers {
  windows {
    webdriver.chrome.driver = "src/test/resources/drivers/windows/chromedriver.exe"
    webdriver.gecko.driver = "src/test/resources/drivers/windows/geckodriver.exe"
  }
  mac {
    webdriver.chrome.driver = "src/test/resources/webdriver/mac/chromedriver"
    webdriver.gecko.driver = "src/test/resources/webdriver/mac/geckodriver"
  }
  linux {
    webdriver.chrome.driver = "src/test/resources/webdriver/linux/chromedriver"
    webdriver.gecko.driver = "src/test/resources/webdriver/linux/geckodriver"
  }
}

#
# This section defines environment-specific configuration for different environments.
# You can define normal Serenity properties, such as webdriver.base.url, or custom ones
# You can find more details about this feature at https://johnfergusonsmart.com/environment-specific-configuration-in-serenity-bdd/
#

environments {
  default {
    #webdriver.base.url = "https://sii3qa.confecamaras.co"
    webdriver.base.url = "https://siifrontqa.confecamaras.co/"
  }

  dev {
    webdriver.base.url = "https://sii3pruebas.confecamaras.co"
  }

  staging {
    webdriver.base.url = "https://sii3pruebas.confecamaras.co"
  }

  prod {
    webdriver.base.url = "https://sii3pruebas.confecamaras.co"
  }

}