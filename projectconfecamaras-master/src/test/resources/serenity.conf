serenity.project.name = Confecamaras

# TOMAR CAPTURAS
serenity.take.screenshots = FOR_EACH_ACTION
serenity.use.unique.browser = false

# Driver Healenium
webdriver.driver = provided
webdriver.provided.type = myhealenium
webdriver.provided.myhealenium = com.co.confecamaras.navigation.HealeniumDriverProvider

webdriver.wait.for.timeout = 20000
serenity.browser.maximized = true
driver.page_load_strategy = normal

serenity.browser.height = 1080
serenity.browser.width = 1920

chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
--disable-default-apps;--disable-extensions-file-access-check;
--incognito;--disable-infobars;--disable-gpu"""

environments {
  default {
    webdriver.base.url = "https://siifrontqa.confecamaras.co/"
  }
}
